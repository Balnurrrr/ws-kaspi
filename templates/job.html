{% extends 'base.html' %}{% block c %}<h1>Идёт работа</h1><p class="s" id="stage">…</p><div class="bar"><i id="b"></i></div><div id="res"></div>
<script>
const jid="{{jid}}",esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function poll(){let d;try{d=await (await fetch('/status/'+jid)).json()}catch(e){setTimeout(poll,3000);return}
document.getElementById('stage').textContent=d.stage;if(d.total)document.getElementById('b').style.width=(100*d.done/d.total)+'%';
if(!d.finished){setTimeout(poll,1500);return}
document.getElementById('b').style.width='100%';let h='';
if(d.error){h='<p class="err">Ошибка: '+esc(d.error)+'</p>'}else{
h+='<div class="card"><h2>Фото</h2><p>Найдены для '+d.photos.with+' артикулов; без фото: '+d.photos.without+'</p></div>';
(d.warnings||[]).forEach(w=>h+='<p class="err">'+esc(w)+'</p>');
d.results.forEach(r=>{h+='<div class="card"><h2>'+esc(r.category.replace('Master - ',''))+' — '+r.positions+' товаров</h2>';
r.zips.forEach(z=>h+='<div class="dl"><span>'+esc(z.zip)+' · '+z.articles+' артикулов · '+z.mb+' МБ</span><a class="btn" href="/download/'+jid+'/'+encodeURIComponent(z.zip)+'">Скачать</a></div>');h+='</div>'});
d.templates.filter(t=>!t.supported).forEach(t=>h+='<p class="err">Для «'+esc(t.category)+'» правил пока нет (файл '+esc(t.file)+').</p>');
if(d.skipped)h+='<div class="card"><h2>Не сделано: '+d.skipped+'</h2><div class="dl"><span>Список с причинами</span><a class="btn" href="/download/'+jid+'/Не_сделано.xlsx">Скачать</a></div></div>'}
document.getElementById('res').innerHTML=h;document.querySelector('h1').textContent=d.error?'Не получилось':'Готово'}
poll()</script>{% endblock %}
